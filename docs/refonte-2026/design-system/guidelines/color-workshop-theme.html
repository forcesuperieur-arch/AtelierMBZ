<!-- @dsCard group="Colors" viewport="700x170" name="Workshop theme" subtitle="Dark means the screen lives in the workshop, not that the user prefers dark" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<style>html,body{margin:0}body{background:var(--pk-page);font-family:var(--mb-font-montserrat);color:var(--pk-ink);padding:16px}a{color:var(--pk-link)}a:hover{color:#000}
.sw{display:flex;gap:0}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;font-family:var(--mb-font-inter)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.tok{font-family:var(--mb-font-inter);font-size:11px;color:var(--pk-ink-muted)}
.trio{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.trio b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.trio span{font-size:12px}
</style>
</head><body>

<div style="display:flex;border:1px solid var(--pk-border)">
  <div style="flex:1;background:#141414;padding:16px 18px;display:flex;flex-direction:column;gap:8px">
    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a5a5a5">Atelier · #141414</div>
    <div style="background:#1f1f1f;border:1px solid #333;padding:12px">
      <div style="font-size:13px;color:#f6f6f6;font-weight:600">OR 2418 — Tiger 900</div>
      <div style="font-size:12px;color:#a5a5a5;margin-top:3px">Pointé 1 h 40 / vendu 2 h</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <span style="background:#f1ab00;color:#000;font-size:12px;font-weight:700;padding:7px 12px">Terminer</span>
        <span style="border:1px solid #4a4a4a;color:#f6f6f6;font-size:12px;font-weight:600;padding:7px 12px">Pause</span>
      </div>
    </div>
  </div>
  <div style="flex:1;background:#f6f6f6;padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--pk-border)">
    <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6f6e6e">Bureau · #f6f6f6</div>
    <div style="background:#fff;border:1px solid #d4d4d4;padding:12px">
      <div style="font-size:13px;color:#1a1a1a;font-weight:600">OR 2418 — Tiger 900</div>
      <div style="font-size:12px;color:#5e5e5e;margin-top:3px">Pointé 1 h 40 / vendu 2 h</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <span style="background:#f1ab00;color:#000;font-size:12px;font-weight:700;padding:7px 12px">Facturer</span>
        <span style="border:1px solid #b9b9b9;color:#1a1a1a;font-size:12px;font-weight:600;padding:7px 12px">Imprimer</span>
      </div>
    </div>
  </div>
</div>

</body></html>
