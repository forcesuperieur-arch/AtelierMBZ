<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<style>html,body{margin:0}body{background:var(--pk-page);font-family:var(--mb-font-montserrat);color:var(--pk-ink);padding:16px}a{color:var(--pk-link)}a:hover{color:#000}
.sw{display:flex;gap:0}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;font-family:var(--mb-font-inter)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.tok{font-family:var(--mb-font-inter);font-size:11px;color:var(--pk-ink-muted)}
.trio{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.trio b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.trio span{font-size:12px}
</style>
</head><body>

<div class="grid">
<div style="display:flex;flex-direction:column;gap:5px;width:124px"><div style="height:52px;background:var(--pk-surface);border:1px solid var(--pk-border-control);border-radius:0px"></div><span class="tok">0px — Champ, carte du front client, aplat plein</span></div><div style="display:flex;flex-direction:column;gap:5px;width:124px"><div style="height:52px;background:var(--pk-surface);border:1px solid var(--pk-border-control);border-radius:4px"></div><span class="tok">4px — Bloc de planning</span></div><div style="display:flex;flex-direction:column;gap:5px;width:124px"><div style="height:52px;background:var(--pk-surface);border:1px solid var(--pk-border-control);border-radius:6px"></div><span class="tok">6px — Tuile de pont, vignette photo</span></div><div style="display:flex;flex-direction:column;gap:5px;width:124px"><div style="height:52px;background:var(--pk-surface);border:1px solid var(--pk-border-control);border-radius:8px"></div><span class="tok">8px — Carte, contrôle, tuile de KPI</span></div><div style="display:flex;flex-direction:column;gap:5px;width:124px"><div style="height:52px;background:var(--pk-surface);border:1px solid var(--pk-border-control);border-radius:999px"></div><span class="tok">999px — Pilule, action principale, compteur</span></div>
</div>

</body></html>
