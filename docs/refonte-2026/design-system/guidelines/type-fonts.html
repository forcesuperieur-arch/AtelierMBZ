<!-- @dsCard group="Type" viewport="700x140" name="Families" subtitle="Montserrat everywhere; Inter for dense tabular data" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<style>html,body{margin:0}body{background:var(--pk-page);font-family:var(--mb-font-montserrat);color:var(--pk-ink);padding:16px}a{color:var(--pk-link)}a:hover{color:#000}
.sw{display:flex;gap:0}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;font-family:var(--mb-font-inter)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.tok{font-family:var(--mb-font-inter);font-size:11px;color:var(--pk-ink-muted)}
.trio{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.trio b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.trio span{font-size:12px}
</style>
</head><body>

<div style="display:flex;gap:16px">
<div style="flex:1;padding:12px 14px;background:var(--pk-surface);border:1px solid var(--pk-border)">
  <div style="font-family:var(--mb-font-montserrat);font-size:20px;font-weight:600">Montserrat</div>
  <div style="font-family:var(--mb-font-montserrat);font-size:14px;color:var(--pk-ink-quiet);margin-top:4px">400 · 500 · 600 · 700 — titres, corps, contrôles</div>
  <div class="tok" style="margin-top:6px">--mb-font-montserrat · 9 graisses locales, upright + italique</div>
</div>
<div style="flex:1;padding:12px 14px;background:var(--pk-surface);border:1px solid var(--pk-border)">
  <div style="font-family:var(--mb-font-inter);font-size:20px;font-weight:600">Inter</div>
  <div style="font-family:var(--mb-font-inter);font-size:14px;color:var(--pk-ink-quiet);margin-top:4px">EX-421-QR · 28 412 km · 412,50 €</div>
  <div class="tok" style="margin-top:6px">--mb-font-inter · immatriculations, hex, données tabulaires</div>
</div>
</div>

</body></html>
