<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="E-mails clients" description="Devis à signer, facture, rappel de rendez-vous — une colonne de 552 px qui survit à tous les clients de messagerie." -->
<helmet><script src="./boot.js"></script><style>html,body{margin:0;background:#ececec}body{font-family:var(--mb-font-montserrat);padding:24px}a{color:var(--pk-link)}a:hover{color:#000}button{font-family:inherit}</style></helmet>
<x-import component-from-global-scope="PaddockEmailsApp" mail="{{ mail }}" logo="{{ logo }}" hint-size="600px,900px"></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:650,&quot;height&quot;:900},&quot;mail&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;les trois&quot;,&quot;devis&quot;,&quot;facture&quot;,&quot;rappel&quot;],&quot;default&quot;:&quot;les trois&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;../../assets/paddock-logo-favicon.svg&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    return { mail: p.mail ?? 'les trois', logo: p.logo ?? '../../assets/paddock-logo-favicon.svg' };
  }
}
</script>
</body>
</html>
