<!-- @dsCard group="Public" viewport="2520x900" name="Front public sans compte" subtitle="Landing, prise de RDV (4 étapes), suivi par lien, écran « prête », mot de passe oublié, mentions" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<title>Paddock — front public</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0;background:#ececec}body{font-family:var(--mb-font-montserrat);color:var(--pk-ink)}#root{display:flex;gap:20px;padding:20px;align-items:flex-start}.col{display:flex;flex-direction:column;gap:8px}.lbl{font-size:12px;font-weight:600;color:#6f6e6e}a{color:var(--pk-link)}a:hover{color:#000}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="BookingFlow.jsx"></script>
<script type="text/babel" src="TrackScreens.jsx"></script>
<script type="text/babel" src="PublicPages.jsx"></script>
<script type="text/babel">
const LOGO = '../../assets/paddock-logo-horizontal.svg';
ReactDOM.createRoot(document.getElementById('root')).render(
  <>
    <div className="col"><span className="lbl">Landing client</span><window.LandingScreen logo={LOGO} /></div>
    <div className="col"><span className="lbl">Prise de RDV en ligne · 4 étapes cliquables</span><window.BookingFlow logo={LOGO} /></div>
    <div className="col"><span className="lbl">Suivi par lien · un accord à donner</span><window.TrackScreen logo={LOGO} /></div>
    <div className="col"><span className="lbl">Prête · le seul écran que le client veut voir</span><window.TrackReadyScreen logo={LOGO} /></div>
    <div className="col"><span className="lbl">Mot de passe oublié · client uniquement</span><window.PasswordResetScreen logo={LOGO} /></div>
    <div className="col"><span className="lbl">Mentions et confidentialité</span><window.LegalScreen logo={LOGO} /></div>
  </>
);
</script></body></html>
