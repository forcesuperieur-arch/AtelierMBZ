<!-- @dsCard group="Brand" viewport="700x160" name="Surfaces and cards" subtitle="Flat, bordered, no shadow — separation comes from lines" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<style>html,body{margin:0}body{background:var(--pk-page);font-family:var(--mb-font-montserrat);color:var(--pk-ink);padding:16px}a{color:var(--pk-link)}a:hover{color:#000}
.sw{display:flex;gap:0}.sw div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;font-family:var(--mb-font-inter)}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.tok{font-family:var(--mb-font-inter);font-size:11px;color:var(--pk-ink-muted)}
.trio{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.trio b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.trio span{font-size:12px}
</style>
</head><body>

<div class="grid" style="align-items:stretch">
<div style="flex:1;background:var(--pk-surface);border:1px solid var(--pk-border);border-radius:8px;padding:14px 16px"><div style="font-size:14px;font-weight:600">Carte neutre</div><div class="tok" style="margin-top:4px">#fbfbfb + bordure #d4d4d4 + radius 8</div></div>
<div style="flex:1;background:#fff;border:1px solid var(--pk-border);border-top:3px solid var(--pk-accent);border-radius:6px;padding:14px 16px"><div style="font-size:14px;font-weight:600">Tuile occupée</div><div class="tok" style="margin-top:4px">Coiffe jaune 3px, surface blanche</div></div>
<div style="flex:1;border:1px dashed var(--pk-border-control);border-radius:6px;padding:14px 16px"><div style="font-size:14px;font-weight:600">Vide</div><div class="tok" style="margin-top:4px">Pointillé, aucun fond</div></div>
<div style="flex:1;background:#000;color:#f6f6f6;padding:14px 16px"><div style="font-size:14px;font-weight:600">Surface catchy</div><div class="tok" style="margin-top:4px;color:#a5a5a5">Noir plein, radius 0, accent jaune</div></div>
</div>
<div class="tok" style="margin-top:10px">Aucune ombre portée dans le système. Une carte se détache par sa bordure ou par un changement de fond.</div>

</body></html>
