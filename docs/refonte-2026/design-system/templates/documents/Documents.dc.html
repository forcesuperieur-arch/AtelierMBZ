<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Documents A4" description="Les trois documents qui sortent de l'atelier : ordre de réparation, état des lieux, facture." -->
<helmet><script src="./boot.js"></script><style>html,body{margin:0;background:#ececec}body{font-family:var(--mb-font-montserrat);padding:24px}a{color:var(--pk-link)}a:hover{color:#000}button{font-family:inherit}</style></helmet>
<x-import component-from-global-scope="PaddockDocumentsApp" document="{{ document }}" logo="{{ logo }}" hint-size="640px,920px"></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:960},&quot;document&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;or&quot;,&quot;etat&quot;,&quot;facture&quot;],&quot;default&quot;:&quot;or&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;../../assets/paddock-logo-stacked.svg&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    return { document: p.document ?? 'or', logo: p.logo ?? '../../assets/paddock-logo-stacked.svg' };
  }
}
</script>
</body>
</html>
